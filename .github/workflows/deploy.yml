name: 🚀 Despliegue Automático Full-Stack (Frontend + Backend + BD)

on:
  push:
    branches:
      - main  # Se dispara automáticamente con cada `git push origin main`

jobs:
  # 1. ETAPA DE BASE DE DATOS (MIGRACIONES AUTOMÁTICAS)
  database-migration:
    name: 🗄️ Aplicar Migraciones en Base de Datos (PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm ci

      - name: Ejecutar Migraciones de Prisma en la Base de Datos Cloud
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          npx prisma migrate deploy

  # 2. ETAPA DE BACKEND (COMPILACIÓN Y DESPLIEGUE A AWS)
  backend-deploy:
    name: ⚙️ Desplegar Backend (Node.js API)
    needs: database-migration
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar y Compilar Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

  # 3. ETAPA DE FRONTEND (COMPILACIÓN Y DESPLIEGUE A AWS S3 / AMPLIFY)
  frontend-deploy:
    name: 🎨 Desplegar Frontend (React + Vite)
    needs: database-migration
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm ci

      - name: Compilar Frontend (React 19)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd frontend
          npm run build

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sincronizar Frontend compilado a AWS S3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.AWS_S3_BUCKET }} --delete
